<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>اسعد اللويهي | سلمان أمين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body>
<main>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker Registered!', reg))
        .catch(err => console.log('Service Worker Reg Failed:', err));
    });
  }
  </script>

  <div class="head">
    <h1 id="t-name">سلمان امين</h1>
    <p class="sub" id="t-sub">اختر اللي تبيه وشوف السعر.</p>
    <div class="ctl"><div class="cur" id="langs" role="group" aria-label="Language"></div><div class="cur" id="cur" role="group" aria-label="Currency"></div></div>
  </div>

  <section class="sheet">
    <h2 id="t-site">الموقع</h2>
    <p class="hint" id="t-hint">اللغة الأساسية عربي، والباقي من الإضافات</p>
    <div id="types" role="radiogroup" aria-label="نوع الموقع"></div>
  </section>

  <section class="sheet">
    <h2 id="t-extras">إضافات</h2>
    <div id="extras"></div>
  </section>
  <footer class="ig"><a id="ig-team" target="_blank" rel="noopener"></a><a id="ig-me" target="_blank" rel="noopener"></a></footer>
</main>

<div class="bar">
  <div class="cap">
    <div>
      <div class="lbl" id="t-cost">التكلفة التقديرية</div>
      <div class="total"><em id="tot" style="font-style:normal">0</em><span id="cur-unit">ليرة</span></div>
      <div class="days" id="days"></div>
      <div class="days" id="multi" style="opacity:.7"></div>
    </div>
    <a class="cta" id="wa" href="#" target="_blank" rel="noopener"><span id="t-order">اطلب الموقع</span></a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
